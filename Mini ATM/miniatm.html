<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini ATM</title>

</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #eef2f7;
}

.atm-container {
    width: 400px;
    padding: 30px;

    background: white;
    border-radius: 20px;

    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}

.atm-container > h1 {
    text-align: center;
    color: #1f2937;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
}

/* Balance */

.balance-card {
    background: #1f2937;
    color: white;

    padding: 20px;
    border-radius: 15px;

    text-align: center;
    margin-bottom: 20px;
}

.balance-card p {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 8px;
}

.balance-card h2 {
    font-size: 30px;
}

/* Transaction cards */

.transaction-card {
    padding: 20px;
    border: 1px solid #e5e7eb;
    border-radius: 15px;

    margin-bottom: 15px;
}

.transaction-card h2 {
    font-size: 20px;
    color: #374151;
    margin-bottom: 15px;
}

/* Input */

input {
    width: 100%;
    padding: 12px;

    border: 1px solid #d1d5db;
    border-radius: 8px;

    font-size: 16px;
    outline: none;

    margin-bottom: 10px;
}

input:focus {
    border-color: #2563eb;
}

/* Buttons */

button {
    width: 100%;
    padding: 12px;

    border: none;
    border-radius: 8px;

    background: #2563eb;
    color: white;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #1d4ed8;
}

#withdrawBtn {
    background: #dc2626;
}

#withdrawBtn:hover {
    background: #b91c1c;
}

/* Transaction messages */


#newbalance,
#newbalance2 {
    margin-top: 12px;
    padding: 10px 12px;

    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;

    border-radius: 8px;
    background: #f0fdf4;
    color: #166534;

    border-left: 4px solid #22c55e;
}
#newbalance2 {
    background: #eff6ff;
    color: #1e40af;
    border-left: 4px solid #3b82f6;
}

</style>
<body>

    <div class="atm-container">

        <h1>🏦 Mini ATM</h1>
        <p class="subtitle">Manage your account balance</p>

        <!-- Current Balance -->
        <div class="balance-card">
            <p>Current Balance</p>
            <h2>Rs. <span id="balance">10000</span></h2>
        </div>

        <!-- Deposit Section -->
        <div class="transaction-card">
            <h2>Deposit Money</h2>

            <input
                type="number"
                id="depositamount"
                placeholder="Enter deposit amount"
            >

            <button type="button" id="depositBtn">
                Deposit
            </button>

            <p class="depositp" id="newbalance"></p>
        </div>

        <!-- Withdraw Section -->
        <div class="transaction-card">
            <h2>Withdraw Money</h2>

            <input
                type="number"
                id="Withdrawlamount"
                placeholder="Enter withdrawal amount"
            >

            <button type="button" id="withdrawBtn">
                Withdraw
            </button>

            <p class="withdrawp" id="newbalance2"></p>
        </div>

    </div>

    <script src="/Day2/miniatm.js"></script>

</body>
</html>
