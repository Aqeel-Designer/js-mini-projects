<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        * {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #121212;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

#container {
    width: 650px;
    min-height: 350px;

    padding: 50px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 20px;

    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);

    text-align: center;
}

h1 {
    margin: 0 0 35px;

    font-size: 32px;
    line-height: 1.3;

    color: #f5f5f5;
}

button {
    padding: 14px 35px;

    border: none;
    border-radius: 10px;

    background: #4ade80;
    color: #121212;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.2s ease;
}

button:hover {
    background: #22c55e;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

#newpassword {
    width: 100%;
    min-height: 60px;

    margin: 35px 0 0;
    padding: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #121212;
    border: 1px solid #333;
    border-radius: 10px;

    color: #4ade80;

    font-size: 20px;
    letter-spacing: 2px;

    word-break: break-all;
}
    </style>
</head>

<body>
    <div id="container">
        <h1>Press the Button to generate a new password</h1>
        <button onclick="generatePassword()">Generate</button>
        <h2 id="newpassword"></h2>
    </div>
    <script>
        const newpassword = document.getElementById("newpassword");
        function generatePassword() {
            const passwordLength = 12;
            const includeLowercase = true;
            const includeUppercase = true;
            const includeNumbers = true;
            const includeSymbols = true;

            const lowercaseChars = "abcdefghijklmnopqrstuvwxyz";
            const uppercaseChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const numbersChars = "0123456789";
            const symbolsChars = "!@#$%^&*()_+";

            let allowedChars = "";
            let password = "";

            allowedChars += includeLowercase ? lowercaseChars : "";
            allowedChars += includeUppercase ? uppercaseChars : "";
            allowedChars += includeNumbers ? numbersChars : "";
            allowedChars += includeSymbols ? symbolsChars : "";

            if (passwordLength <= 0) {
                return `Your password cant have a length of 0`;
            }
            if (allowedChars.length === 0) {
                return `You should atleast have one character selected`;
            }
            for (let i = 0; i < passwordLength; i++) {
                const randomIndex = Math.floor(Math.random() * allowedChars.length);
                password += allowedChars[randomIndex];
            }
           
            newpassword.textContent = `Your new password is : ${password}`;
        }






    </script>

</body>

</html>
