<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice roller</title>
    <style>
        /* Page */
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1e1e2f;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
}

/* Main container */
#container {
    width: 800px;
    min-height: 500px;
    padding: 40px;
    box-sizing: border-box;

    background: #2b2b40;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);

    text-align: center;
}

/* Heading */
h1 {
    margin-top: 0;
    margin-bottom: 30px;
    font-size: 42px;
    color: #ffffff;
}

/* Label */
label {
    display: block;
    margin-bottom: 10px;
    font-size: 18px;
    color: #dcdcec;
}

/* Number input */
#numOfDice {
    width: 100px;
    padding: 12px;
    margin-bottom: 20px;

    border: 2px solid #55556f;
    border-radius: 8px;
    background: #1e1e2f;
    color: white;

    font-size: 18px;
    text-align: center;
    outline: none;
}

#numOfDice:focus {
    border-color: #7c5cff;
}

/* Roll button */
button {
    display: block;
    margin: 0 auto 30px;

    padding: 13px 30px;

    border: none;
    border-radius: 10px;

    background: #7c5cff;
    color: white;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.2s ease;
}

button:hover {
    background: #6848e8;
    transform: translateY(-2px);
}

button:active {
    transform: translateY(0);
}

/* Result text */
#diceResult {
    margin-bottom: 25px;
    min-height: 25px;

    font-size: 20px;
    font-weight: bold;
    color: #dcdcec;
}

/* Dice images container */
#diceImages {
    width: 100%;

    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;

    gap: 15px;

    box-sizing: border-box;
}

/* Dice */
#diceImages img {
    width: 150px;
    height: 150px;

    object-fit: contain;

    flex: 0 0 150px;
}
    </style>
</head>
<body>
    <div id="container">
        <h1>Dice Roller</h1>
        <label for="">Number of Dice to Roll</label>
        <input type="number" id="numOfDice" min="1">
        <button onclick="rollDice()">Roll Dice</button>
        <div id="diceResult"></div>
        <div id="diceImages"></div>
    </div>



<script src="diceroller.js"></script>    
</body>
</html>
